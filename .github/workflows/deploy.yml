name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "ludum-dare/57-depths/**"
      - "ludum-dare/59-signal/prototypes/**"
      - "ludum-dare/59-signal/game/**"
      - "genuary/2026/**"
      - "README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Ludum Dare
        working-directory: ludum-dare/57-depths
        run: |
          bun install
          bun run build

      - name: Build Genuary
        working-directory: genuary/2026
        run: |
          npm install
          npm run build

      - name: Build LD59 Phase Chorus prototype
        working-directory: ludum-dare/59-signal/prototypes/phase-chorus
        run: |
          bun install
          bun run build

      - name: Build LD59 CROSSED WIRES
        working-directory: ludum-dare/59-signal/game
        run: |
          bun install
          bun run build

      - name: Create Landing Page
        run: |
          node .github/scripts/generate-landing-page.js

      - name: Organize Build Output
        run: |
          # Copy ludum-dare build to _site/ludum-dare-57
          mkdir -p _site/ludum-dare-57
          cp -r ludum-dare/57-depths/dist/* _site/ludum-dare-57/
          
          # Copy genuary build to _site/genuary-2026
          mkdir -p _site/genuary-2026
          cp -r genuary/2026/dist/* _site/genuary-2026/

          # Copy LD59 Phase Chorus prototype to _site/ld59/prototypes/phase-chorus
          mkdir -p _site/ld59/prototypes/phase-chorus
          cp -r ludum-dare/59-signal/prototypes/phase-chorus/dist/* _site/ld59/prototypes/phase-chorus/

          # Copy LD59 CROSSED WIRES (the actual entry) to _site/ld59
          cp -r ludum-dare/59-signal/game/dist/* _site/ld59/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
